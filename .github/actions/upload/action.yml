name: Upload Staging
description: Upload the staging/ directory as a GitHub artifact (skipped under act without artifact server).
inputs:
  artifact_name:
    description: 'Artifact name'
    required: true
runs:
  using: composite
  steps:
    - name: Upload
      if: ${{ env.IS_ACT != 'true' || env.ACTIONS_RUNTIME_URL != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: staging/
        # 7 days: the fork's CI is consumed by GodotJS-Ext's fast path, which
        # downloads these per-platform artifacts directly instead of waiting for
        # a full release. A 1-day window made that path unreliable.
        retention-days: 7
