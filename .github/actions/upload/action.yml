name: Upload Staging
description: Upload the staging/ directory as a GitHub artifact (skipped under act without artifact server).
inputs:
  artifact_name:
    description: 'Artifact name'
    required: true
runs:
  using: composite
  steps:
    - name: Upload
      if: ${{ env.IS_ACT != 'true' || env.ACTIONS_RUNTIME_URL != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: staging/
        retention-days: 1
