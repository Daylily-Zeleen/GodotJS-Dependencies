name: Fetch LWS
description: Fetch libwebsockets (v4.3-stable) + install platform build deps, cross-platform.
inputs:
  platform:
    description: 'Target platform: linux | macos | windows | android | ios'
    required: true
  arch:
    description: 'Target arch: x86_64 | arm64 | arm32'
    required: true

runs:
  using: composite
  steps:
    - name: Fetch lws (unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        SUDO=""
        if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi

        # --- platform build deps ---
        case "${{ inputs.platform }}" in
          linux)
            $SUDO apt-get clean || true
            $SUDO rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* || true
            $SUDO DEBIAN_FRONTEND=noninteractive apt-get update
            if [ "${{ inputs.arch }}" = "x86_64" ]; then
              $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git cmake build-essential ca-certificates
            else
              $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git cmake ca-certificates gcc-aarch64-linux-gnu g++-aarch64-linux-gnu make
            fi
            ;;
          android)
            $SUDO apt-get clean || true
            $SUDO rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* || true
            $SUDO DEBIAN_FRONTEND=noninteractive apt-get update
            $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git cmake unzip zip ca-certificates
            cd "$GITHUB_WORKSPACE"
            if [ ! -d "$GITHUB_WORKSPACE/android-ndk-r23c" ]; then
              wget -O android-ndk.zip -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
              unzip -q android-ndk.zip
            fi
            ;;
          macos|ios)
            if ! command -v cmake >/dev/null 2>&1; then
              if command -v brew >/dev/null 2>&1; then
                brew update || true
                brew install cmake || true
              fi
            fi
            if ! command -v cmake >/dev/null 2>&1; then
              /usr/bin/python3 -m pip install --user cmake
              echo "PATH=$HOME/Library/Python/3.12/bin:$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
            fi
            ;;
        esac

        # --- clone libwebsockets ---
        # Try GitHub mirror first (official libwebsockets.org is often unreachable from CI),
        # fall back to the official repo.
        cd "$GITHUB_WORKSPACE"
        if [ ! -d libwebsockets/.git ]; then
          for repo in https://github.com/warmcat/libwebsockets.git https://libwebsockets.org/repo/libwebsockets; do
            echo "Trying $repo ..."
            if git clone --branch v4.3-stable --depth 1 "$repo" libwebsockets; then
              break
            fi
            rm -rf libwebsockets
          done
        fi
        if [ ! -d libwebsockets/.git ]; then
          echo "Failed to clone libwebsockets from all mirrors" >&2
          exit 1
        fi
        cd libwebsockets
        git checkout v4.3-stable

    - name: Fetch lws (windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        cd $env:GITHUB_WORKSPACE
        if (-not (Test-Path "libwebsockets/.git")) {
          $ok = $false
          foreach ($repo in @("https://github.com/warmcat/libwebsockets.git", "https://libwebsockets.org/repo/libwebsockets")) {
            Write-Host "Trying $repo ..."
            git clone --branch v4.3-stable --depth 1 $repo libwebsockets
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if (Test-Path "libwebsockets") { Remove-Item -Recurse -Force libwebsockets }
          }
          if (-not $ok) { throw "Failed to clone libwebsockets from all mirrors" }
        }
        cd libwebsockets
        git checkout v4.3-stable
