name: Fetch Node
description: Fetch Node.js source (official nodejs/node) at the requested branch/tag.
inputs:
  node_version:
    description: 'Node.js branch/tag to build (e.g. v24.x)'
    required: true
  platform:
    description: 'Target platform: linux | macos | windows | android | ios | ohos'
    required: true

runs:
  using: composite
  steps:
    - name: Fetch node (unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        git_retry() {
          local tries=5 delay=15 cmd=("$@")
          for i in $(seq 1 "$tries"); do
            if "${cmd[@]}"; then return 0; fi
            echo "git_retry: attempt $i/$tries failed, retrying in ${delay}s" >&2
            sleep "$delay"
          done
          echo "git_retry: all $tries attempts failed" >&2
          return 1
        }
        cd "$GITHUB_WORKSPACE"
        if [ ! -d node/.git ]; then
          git_retry git clone --depth 1 --branch "${{ inputs.node_version }}" https://github.com/nodejs/node.git
        else
          cd node
          git_retry git fetch --depth 1 origin "${{ inputs.node_version }}" || git_retry git fetch --depth 1 origin tag "${{ inputs.node_version }}" || true
          git checkout "${{ inputs.node_version }}" || true
          cd "$GITHUB_WORKSPACE"
        fi
        cd node
        git checkout "${{ inputs.node_version }}" 2>/dev/null || git checkout -B build FETCH_HEAD 2>/dev/null || true
        git log -1 --oneline || true

    - name: Fetch node (windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        function Invoke-GitRetry {
          param([scriptblock]$Body)
          $tries = 5; $delay = 15
          for ($i = 1; $i -le $tries; $i++) {
            & $Body
            if ($LASTEXITCODE -eq 0) { return }
            Write-Host "git_retry: attempt $i/$tries failed, retrying in ${delay}s"
            Start-Sleep -Seconds $delay
          }
          throw "git_retry: all $tries attempts failed"
        }
        cd $env:GITHUB_WORKSPACE
        if (-not (Test-Path "node/.git")) {
          Invoke-GitRetry { git clone --depth 1 --branch "${{ inputs.node_version }}" https://github.com/nodejs/node.git }
        }
        cd node
        git checkout "${{ inputs.node_version }}"
