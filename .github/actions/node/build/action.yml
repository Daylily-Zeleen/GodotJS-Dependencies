name: Build Node
description: Build node (Node.js as an embeddable static library) using scripts/node/build-* scripts.
inputs:
  node_version:
    description: 'Node.js branch/tag to build (e.g. v24.x)'
    required: true
  platform:
    description: 'Target platform: linux | macos | windows | android | ios | ohos'
    required: true
  arch:
    description: 'Target arch: x86_64 | arm64 | arm32'
    required: true

runs:
  using: composite
  steps:
    - name: Build node (unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.platform }}" in
          linux)
            bash "$GITHUB_WORKSPACE/Scripts/scripts/node/build-linux.sh" "${{ inputs.node_version }}" "${{ inputs.arch }}"
            ;;
          macos)
            bash "$GITHUB_WORKSPACE/Scripts/scripts/node/build-macos.sh" "${{ inputs.node_version }}" "${{ inputs.arch }}"
            ;;
          ios)
            bash "$GITHUB_WORKSPACE/Scripts/scripts/node/build-ios.sh" "${{ inputs.node_version }}"
            ;;
          android)
            bash "$GITHUB_WORKSPACE/Scripts/scripts/node/build-android.sh" "${{ inputs.node_version }}" "${{ inputs.arch }}"
            ;;
          ohos)
            bash "$GITHUB_WORKSPACE/Scripts/scripts/node/build-ohos.sh" "${{ inputs.node_version }}"
            ;;
        esac
        mkdir -p "$GITHUB_WORKSPACE/staging/libnode/${{ inputs.platform }}/${{ inputs.platform == 'windows' && 'x64' || inputs.arch }}"
        git -C "$GITHUB_WORKSPACE/node" rev-parse HEAD > "$GITHUB_WORKSPACE/staging/libnode/${{ inputs.platform }}/${{ inputs.platform == 'windows' && 'x64' || inputs.arch }}/node-commit.txt"
        python3 "$GITHUB_WORKSPACE/Scripts/scripts/verify_artifacts.py" node \
          --root "$GITHUB_WORKSPACE/staging/libnode" \
          --platform "${{ inputs.platform }}" \
          --arch "${{ inputs.arch }}"
        python3 "$GITHUB_WORKSPACE/Scripts/scripts/verify_symbols.py" node \
          --root "$GITHUB_WORKSPACE/staging/libnode" \
          --platform "${{ inputs.platform }}" \
          --arch "${{ inputs.arch }}"

    - name: Build node (windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        & "$env:GITHUB_WORKSPACE\Scripts\scripts\node\build-windows.ps1" `
          -Branch "${{ inputs.node_version }}" `
          -DestCpu "${{ inputs.arch }}"
        $nodeRoot = Join-Path $env:GITHUB_WORKSPACE "staging/libnode/windows/x64"
        New-Item -ItemType Directory -Force -Path $nodeRoot | Out-Null
        git -C (Join-Path $env:GITHUB_WORKSPACE "node") rev-parse HEAD | Out-File -Encoding ascii (Join-Path $nodeRoot "node-commit.txt")
        python "$env:GITHUB_WORKSPACE\Scripts\scripts\verify_artifacts.py" node --root "$env:GITHUB_WORKSPACE\staging\libnode" --platform "${{ inputs.platform }}" --arch "${{ inputs.arch }}"
        python "$env:GITHUB_WORKSPACE\Scripts\scripts\verify_symbols.py" node --root "$env:GITHUB_WORKSPACE\staging\libnode" --platform "${{ inputs.platform }}" --arch "${{ inputs.arch }}"
