name: Fetch V8
description: Fetch V8 source (depot_tools + fetch + checkout tag + gclient sync), cross-platform.
inputs:
  v8_version:
    description: 'V8 version tag to build (e.g. 13.5.119)'
    required: true
  platform:
    description: 'Target platform: linux | macos | windows | android | ios'
    required: true
  arch:
    description: 'Target arch: x86_64 | arm64 | arm32 (gn arch for windows: x64 | arm64)'
    required: true

runs:
  using: composite
  steps:
    - name: Fetch v8 (unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        # --- Install build dependencies (linux / android only) ---
        if [ "${{ inputs.platform }}" = "linux" ] || [ "${{ inputs.platform }}" = "android" ]; then
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build generate-ninja pkg-config zip unzip ca-certificates
        fi

        # --- V8 13.x needs C++20 (std::make_unique_for_overwrite): use gcc-12 ---
        if [ "${{ inputs.platform }}" = "linux" ]; then
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-12 g++-12
          # Cross-compiling for linux arm64 with use_sysroot=false (see build
          # action) relies on clang's GCC-installation detection to find the
          # target headers/libstdc++: the bullseye sysroot's GCC 10 libstdc++
          # lacks C++20 make_unique_for_overwrite, so instead of the sysroot we
          # provide the cross gcc-12 (GCC 12 libstdc++ has C++20) whose headers
          # live under /usr/aarch64-linux-gnu.
          if [ "${{ inputs.arch }}" = "arm64" ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-12-aarch64-linux-gnu g++-12-aarch64-linux-gnu
          fi
        fi

        cd "$GITHUB_WORKSPACE"

        # --- Android: fetch NDK r23c and append config to args.gn ---
        if [ "${{ inputs.platform }}" = "android" ]; then
          if [ ! -d "$GITHUB_WORKSPACE/android-ndk-r23c" ]; then
            wget -O android-ndk.zip -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
            unzip -q android-ndk.zip
          fi
          echo "default_android_ndk_root = \"$GITHUB_WORKSPACE/android-ndk-r23c\"" >> "$GITHUB_WORKSPACE/Scripts/config/v8/v8.android_${{ inputs.arch }}.args.gn"
          echo "default_android_ndk_version = \"r23c\"" >> "$GITHUB_WORKSPACE/Scripts/config/v8/v8.android_${{ inputs.arch }}.args.gn"
          cat "$GITHUB_WORKSPACE/Scripts/config/v8/v8.android_${{ inputs.arch }}.args.gn"
        fi

        # --- depot_tools ---
        git_retry() {
          local tries=5 delay=15 cmd=("$@")
          for i in $(seq 1 "$tries"); do
            if "${cmd[@]}"; then return 0; fi
            echo "git_retry: attempt $i/$tries failed, retrying in ${delay}s" >&2
            sleep "$delay"
          done
          echo "git_retry: all $tries attempts failed" >&2
          return 1
        }
        if [ ! -d "$GITHUB_WORKSPACE/depot_tools" ]; then
          git_retry git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        fi
        export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
        cd "$GITHUB_WORKSPACE/depot_tools"
        gclient

        # --- fetch v8 ---
        # `fetch --nohooks --nohistory v8` plus the first `gclient sync` is the
        # single most expensive step in this workflow: measured on the windows
        # leg it took 40 of the job's 42 minutes, before any compilation started.
        # The workflow caches v8/ and depot_tools/, so on a re-run (same runner
        # OS + version, which is the normal case while iterating on these
        # scripts) the tree is already present and only the requested tag needs
        # aligning - a few minutes instead of 40.
        if [ -d "$GITHUB_WORKSPACE/v8/v8/.git" ]; then
          echo "v8 source tree restored from cache; aligning to ${{ inputs.v8_version }}"
        else
          echo "no cached v8 source tree; performing the full fetch"
          mkdir -p "$GITHUB_WORKSPACE/v8"
          cd "$GITHUB_WORKSPACE/v8"
          git_retry fetch --nohooks --nohistory v8
        fi
        cd "$GITHUB_WORKSPACE/v8"

        # --- target_os for cross builds ---
        # `.gclient` is part of the cached tree, and the cache key is
        # v8src-<runner OS>-... , so an android leg (which runs on Linux) can
        # restore a tree that a linux leg created. v8's DEPS gates several
        # dependencies on conditions derived from target_os -- third_party/
        # catapult carries 'condition': 'checkout_android' -- and `gclient sync`
        # only checks those out when .gclient declares the target. So the
        # declaration has to be normalised on EVERY run, not just when the tree
        # is first fetched: with the old "append when creating the tree" logic an
        # android leg restoring a linux-made tree never declared android, the
        # catapult checkout was skipped, and `gn gen` then died before compiling
        # a single file:
        #   ERROR at //build/android/BUILD.gn:219:5: Unable to load
        #     ".../v8/v8/third_party/catapult/tracing/BUILD.gn"
        # Rewriting keeps it idempotent, so a warm cache and a cold fetch agree.
        wanted_target_os=""
        case "${{ inputs.platform }}" in
          android) wanted_target_os="['android']" ;;
          ios)     wanted_target_os="['ios']" ;;
        esac
        if [ -n "$wanted_target_os" ]; then
          grep -v "^target_os[[:space:]]*=" .gclient > .gclient.tmp || true
          echo "target_os = $wanted_target_os" >> .gclient.tmp
          mv .gclient.tmp .gclient
          echo "declared target_os = $wanted_target_os in .gclient for ${{ inputs.platform }}"
        else
          # A non-cross leg must not inherit a stale declaration either: a
          # leftover target_os would pull the host build into the wrong
          # configuration.
          if grep -q "^target_os[[:space:]]*=" .gclient; then
            grep -v "^target_os[[:space:]]*=" .gclient > .gclient.tmp || true
            mv .gclient.tmp .gclient
            echo "removed a stale target_os declaration from .gclient (${{ inputs.platform }} is not a cross build)"
          fi
        fi
        cat .gclient

        # --- checkout requested version + sync ---
        cd v8
        git_retry git fetch origin refs/tags/${{ inputs.v8_version }}
        git checkout FETCH_HEAD
        gclient sync -D --force --reset --nohooks

        # Fail here, in seconds, rather than in `gn gen` with an error that
        # names a GN file instead of the missing checkout. The android
        # configuration pulls this in via DEPS 'condition': 'checkout_android';
        # it is the exact dependency whose absence broke all three android legs.
        if [ "${{ inputs.platform }}" = "android" ]; then
          if [ ! -f "$GITHUB_WORKSPACE/v8/v8/third_party/catapult/tracing/BUILD.gn" ]; then
            echo "::error::third_party/catapult is missing after gclient sync; the android checkout did not happen (check target_os in v8/.gclient)"
            ls -la "$GITHUB_WORKSPACE/v8/v8/third_party/" | head -30 || true
            exit 1
          fi
          echo "android dependency check passed: third_party/catapult is present"
        fi
        # Best-effort runhooks: some generators need it, but never fail the build
        # (vpython on macos arm64 can't fetch numpy==1.21.1+supported.1).
        (gclient runhooks || true) 2>&1 | tail -20

    - name: Fetch v8 (windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        cd %GITHUB_WORKSPACE%

        git config --global core.autocrlf false
        git config --global core.filemode false
        git config --global branch.autosetuprebase always
        git config --global core.longpaths true

        curl https://storage.googleapis.com/chrome-infra/depot_tools.zip --output ./depot_tools.zip
        7z x -odepot_tools depot_tools.zip
        set PATH=%GITHUB_WORKSPACE%\depot_tools;%PATH%
        set DEPOT_TOOLS_WIN_TOOLCHAIN=0

        cd depot_tools
        call gclient

        cd ..
        rem The workflow caches v8/ (see build_v8.yml): re-running with the same
        rem runner OS and version - the normal case while iterating on these
        rem scripts - skips the expensive initial fetch and only aligns the tag.
        if exist v8\v8\.git (
          echo v8 source tree restored from cache; aligning to ${{ inputs.v8_version }}
        ) else (
          echo no cached v8 source tree; performing the full fetch
          if not exist v8 mkdir v8
          cd v8
          call fetch --nohooks --nohistory v8
          cd ..
        )
        cd v8\v8
        call git fetch origin refs/tags/${{ inputs.v8_version }}
        call git checkout FETCH_HEAD
        rem keep hooks on windows (no vpython numpy issue; LASTCHANGE.committime needed by gn)
        call gclient sync -D --force --reset
