name: Build V8
description: Build V8 monolith (v8gen + args.gn + ninja) for a given platform/arch and stage artifact.
inputs:
  v8_version:
    description: 'V8 version tag (used for staging dir naming)'
    required: true
  platform:
    description: 'Target platform: linux | macos | windows | android | ios'
    required: true
  arch:
    description: 'Target arch: x86_64 | arm64 | arm32 (gn arch for windows: x64 | arm64)'
    required: true
  target:
    description: 'v8gen target dir, e.g. x64.release | arm64.release | arm.release'
    required: true
  staging_dir:
    description: 'Staging subdir under staging/v8/, e.g. linux.x86_64.release'
    required: true

runs:
  using: composite
  steps:
    - name: Build v8 (unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
        cd "$GITHUB_WORKSPACE/v8/v8"

        # --- install build deps (linux / android) ---
        if [ "${{ inputs.platform }}" = "linux" ] || [ "${{ inputs.platform }}" = "android" ]; then
          if [ "${{ inputs.platform }}" = "android" ]; then
            sh ./build/install-build-deps.sh --android
          else
            sh ./build/install-build-deps.sh
          fi
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
        fi

        # --- sysroot for cross arch ---
        # NB: linux arm64 does NOT install a sysroot here: the chromium bullseye
        # sysroot ships GCC 10 libstdc++ which lacks C++20 make_unique_for_overwrite
        # (V8 13.x requirement), so all linux builds use use_sysroot=false and rely
        # on host/cross gcc-12 headers instead (cross gcc-12-aarch64-linux-gnu is
        # installed by the fetch action). Installing the sysroot here would be dead
        # weight on top of that.
        if [ "${{ inputs.platform }}" = "android" ]; then
          case "${{ inputs.arch }}" in
            arm64) SYSROOT_ARCH=arm64 ;;
            arm32) SYSROOT_ARCH=arm ;;
            x86_64) SYSROOT_ARCH=x64 ;;
          esac
          python ./build/linux/sysroot_scripts/install-sysroot.py --arch=${SYSROOT_ARCH}
        fi

        # --- generate + configure + build ---
        python ./tools/dev/v8gen.py ${{ inputs.target }}
        cp "$GITHUB_WORKSPACE/Scripts/config/v8/v8.${{ inputs.platform }}_${{ inputs.arch }}.args.gn" "$GITHUB_WORKSPACE/v8/v8/out.gn/${{ inputs.target }}/args.gn"
        # V8 13.x needs C++20 std::make_unique_for_overwrite (libstdc++ >= GCC 11).
        # The chromium debian bullseye sysroot ships GCC 10 libstdc++ which lacks it,
        # so on linux use the host system headers instead of the sysroot.
        # NB: args.gn may lack a trailing newline, so ensure one before appending
        if [ "${{ inputs.platform }}" = "linux" ]; then
          ARGS="$GITHUB_WORKSPACE/v8/v8/out.gn/${{ inputs.target }}/args.gn"
          printf '\n' >> "$ARGS"
          printf 'use_sysroot = false\n' >> "$ARGS"
        fi
        cat "$GITHUB_WORKSPACE/v8/v8/out.gn/${{ inputs.target }}/args.gn"
        ls -l "$GITHUB_WORKSPACE/v8/v8/out.gn/${{ inputs.target }}/"
        # macos/ios run on macos-latest (M1, 7GB RAM - same constraint the node
        # build scripts were hardened against). V8 monolith compiles are memory
        # hungry; cap ninja jobs there to avoid OOM-killing the whole build.
        NINJA_JOBS=""
        if [ "${{ inputs.platform }}" = "macos" ] || [ "${{ inputs.platform }}" = "ios" ]; then
          NINJA_JOBS="-j2"
        fi
        ninja -C "./out.gn/${{ inputs.target }}" $NINJA_JOBS v8_monolith

        # --- stage artifact ---
        # The upstream godotjs v8 bundle ships v8/include/ (v8 public headers +
        # cppgc/libplatform + js_protocol files); stage it from every unix job
        # (identical content, deduped when artifacts are merged) so the release
        # bundle matches the upstream layout.
        cd "$GITHUB_WORKSPACE"
        mkdir -p "staging/v8/include"
        cp -r "$GITHUB_WORKSPACE/v8/v8/include/." "staging/v8/include/"
        mkdir -p "staging/v8/${{ inputs.staging_dir }}"
        cp "$GITHUB_WORKSPACE/v8/v8/out.gn/${{ inputs.target }}/obj/libv8_monolith.a" "staging/v8/${{ inputs.staging_dir }}/"
        cp "$GITHUB_WORKSPACE/v8/v8/DEPS" "staging/v8/${{ inputs.staging_dir }}/DEPS"
        python3 "$GITHUB_WORKSPACE/Scripts/scripts/verify_artifacts.py" v8 \
          --root "$GITHUB_WORKSPACE/staging/v8" \
          --platform "${{ inputs.platform }}" \
          --arch "${{ inputs.arch }}"

    - name: Build v8 (windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        set PATH=%GITHUB_WORKSPACE%\depot_tools;%PATH%
        set DEPOT_TOOLS_WIN_TOOLCHAIN=0
        cd %GITHUB_WORKSPACE%\v8\v8

        rem Bump the win-x64 linker stack before generating: V8's BUILD.gn sets
        rem /STACK:2097152 (2MB) for x64 targets and mksnapshot overflows it
        rem during Turbofan scheduling (0xC00000FD). Reserve 256MB instead.
        rem Fail-closed: abort when the upstream pattern is missing.
        powershell -NoProfile -Command "$p='%GITHUB_WORKSPACE%\v8\v8\BUILD.gn'; $t=[IO.File]::ReadAllText($p); if($t.IndexOf('/STACK:2097152') -lt 0){ Write-Error 'expected /STACK:2097152 not found in v8 BUILD.gn'; exit 1 }; [IO.File]::WriteAllText($p, $t.Replace('/STACK:2097152','/STACK:268435456'))"
        if errorlevel 1 exit /b 1
        findstr /C:"/STACK:268435456" "%GITHUB_WORKSPACE%\v8\v8\BUILD.gn" >nul || exit /b 1

        rem windows: v8gen.py is unreliable, use gn gen directly with inline args
        call gn gen .\out.gn\${{ inputs.target }} -args="is_component_build=false is_debug=false target_cpu=""${{ inputs.arch }}"" target_os=""win"" v8_enable_i18n_support=false v8_monolithic=true v8_use_external_startup_data=false v8_enable_pointer_compression=true v8_jitless=false use_custom_libcxx=false treat_warnings_as_errors=false v8_symbol_level=0 v8_enable_sandbox=false"
        rem Inject /STACK straight into the generated ninja link command for
        rem mksnapshot: gn-level knobs proved unreliable for this target and the
        rem default 1MB stack overflows within seconds of startup (0xC00000FD).
        rem Fail-closed: abort unless exactly one mksnapshot link line matched.
        powershell -NoProfile -Command "$n='.\\out.gn\\${{ inputs.target }}\\build.ninja'; $t=[IO.File]::ReadAllText($n); $m=[regex]::Matches($t,'/OUT:(?:\./)?mksnapshot\.exe'); if($m.Count -ne 1){ Write-Error ('unexpected mksnapshot link matches: '+$m.Count); exit 1 }; [IO.File]::WriteAllText($n, [regex]::Replace($t,'(/OUT:(?:\./)?mksnapshot\.exe)','/STACK:268435456 $1'))"
        if errorlevel 1 exit /b 1
        findstr /C:"/STACK:268435456 /OUT" ".\out.gn\${{ inputs.target }}\build.ninja" >nul || exit /b 1
        dir .\out.gn\${{ inputs.target }}
        more .\out.gn\${{ inputs.target }}\args.gn
        call ninja -C .\out.gn\${{ inputs.target }} v8_monolith
        rem Diagnostic: print the PE SizeOfStackReserve actually linked into
        rem mksnapshot so stack-related failures are debuggable from the log.
        python -c "import struct;f=open(r'out.gn\${{ inputs.target }}\mksnapshot.exe','rb');f.seek(0x3c);pe=struct.unpack('<I',f.read(4))[0];f.seek(pe+0x28);print('mksnapshot.exe SizeOfStackReserve =',struct.unpack('<I',f.read(4))[0])" || echo "PE diagnostic skipped"
        dir %GITHUB_WORKSPACE%\v8\v8\out.gn\${{ inputs.target }}\obj\*.lib

        cd %GITHUB_WORKSPACE%
        mkdir staging\v8\include
        mkdir staging\v8\${{ inputs.staging_dir }}
        xcopy %GITHUB_WORKSPACE%\v8\v8\include staging\v8\include\ /Q /R /S /F /Y
        copy %GITHUB_WORKSPACE%\v8\v8\out.gn\${{ inputs.target }}\obj\v8_monolith.lib staging\v8\${{ inputs.staging_dir }}\v8_monolith.lib /Y /B
        copy %GITHUB_WORKSPACE%\v8\v8\DEPS staging\v8\${{ inputs.staging_dir }}\DEPS /Y /B
        python %GITHUB_WORKSPACE%\Scripts\scripts\verify_artifacts.py v8 --root %GITHUB_WORKSPACE%\staging\v8 --platform ${{ inputs.platform }} --arch ${{ inputs.arch }}
