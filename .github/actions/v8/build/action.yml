name: Build V8
description: Build V8 monolith (v8gen + args.gn + ninja) for a given platform/arch and stage artifact.
inputs:
  v8_version:
    description: 'V8 version tag (used for staging dir naming)'
    required: true
  platform:
    description: 'Target platform: linux | macos | windows | android | ios'
    required: true
  arch:
    description: 'Target arch: x86_64 | arm64 | arm32 (gn arch for windows: x64 | arm64)'
    required: true
  target:
    description: 'v8gen target dir, e.g. x64.release | arm64.release | arm.release'
    required: true
  staging_dir:
    description: 'Staging subdir under staging/v8/, e.g. linux.x86_64.release'
    required: true

runs:
  using: composite
  steps:
    - name: Build v8 (unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
        cd "$GITHUB_WORKSPACE/v8/v8"

        # --- install build deps (linux / android) ---
        if [ "${{ inputs.platform }}" = "linux" ] || [ "${{ inputs.platform }}" = "android" ]; then
          if [ "${{ inputs.platform }}" = "android" ]; then
            sh ./build/install-build-deps.sh --android
          else
            sh ./build/install-build-deps.sh
          fi
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
        fi

        # --- sysroot for cross arch ---
        # NB: linux arm64 does NOT install a sysroot here: the chromium bullseye
        # sysroot ships GCC 10 libstdc++ which lacks C++20 make_unique_for_overwrite
        # (V8 13.x requirement), so all linux builds use use_sysroot=false and rely
        # on host/cross gcc-12 headers instead (cross gcc-12-aarch64-linux-gnu is
        # installed by the fetch action). Installing the sysroot here would be dead
        # weight on top of that.
        if [ "${{ inputs.platform }}" = "android" ]; then
          case "${{ inputs.arch }}" in
            arm64) SYSROOT_ARCH=arm64 ;;
            arm32) SYSROOT_ARCH=arm ;;
            x86_64) SYSROOT_ARCH=x64 ;;
          esac
          python ./build/linux/sysroot_scripts/install-sysroot.py --arch=${SYSROOT_ARCH}
        fi

        # --- generate + configure + build ---
        python ./tools/dev/v8gen.py ${{ inputs.target }}
        cp "$GITHUB_WORKSPACE/Scripts/config/v8/v8.${{ inputs.platform }}_${{ inputs.arch }}.args.gn" "$GITHUB_WORKSPACE/v8/v8/out.gn/${{ inputs.target }}/args.gn"
        # V8 13.x needs C++20 std::make_unique_for_overwrite (libstdc++ >= GCC 11).
        # The chromium debian bullseye sysroot ships GCC 10 libstdc++ which lacks it,
        # so on linux use the host system headers instead of the sysroot.
        # NB: args.gn may lack a trailing newline, so ensure one before appending
        if [ "${{ inputs.platform }}" = "linux" ]; then
          ARGS="$GITHUB_WORKSPACE/v8/v8/out.gn/${{ inputs.target }}/args.gn"
          printf '\n' >> "$ARGS"
          printf 'use_sysroot = false\n' >> "$ARGS"
        fi
        cat "$GITHUB_WORKSPACE/v8/v8/out.gn/${{ inputs.target }}/args.gn"
        ls -l "$GITHUB_WORKSPACE/v8/v8/out.gn/${{ inputs.target }}/"
        # macos/ios run on macos-latest (M1, 7GB RAM - same constraint the node
        # build scripts were hardened against). V8 monolith compiles are memory
        # hungry; cap ninja jobs there to avoid OOM-killing the whole build.
        NINJA_JOBS=""
        if [ "${{ inputs.platform }}" = "macos" ] || [ "${{ inputs.platform }}" = "ios" ]; then
          NINJA_JOBS="-j2"
        fi
        ninja -C "./out.gn/${{ inputs.target }}" $NINJA_JOBS v8_monolith

        # --- stage artifact ---
        # The upstream godotjs v8 bundle ships v8/include/ (v8 public headers +
        # cppgc/libplatform + js_protocol files); stage it from every unix job
        # (identical content, deduped when artifacts are merged) so the release
        # bundle matches the upstream layout.
        cd "$GITHUB_WORKSPACE"
        mkdir -p "staging/v8/include"
        cp -r "$GITHUB_WORKSPACE/v8/v8/include/." "staging/v8/include/"
        mkdir -p "staging/v8/${{ inputs.staging_dir }}"
        cp "$GITHUB_WORKSPACE/v8/v8/out.gn/${{ inputs.target }}/obj/libv8_monolith.a" "staging/v8/${{ inputs.staging_dir }}/"
        cp "$GITHUB_WORKSPACE/v8/v8/DEPS" "staging/v8/${{ inputs.staging_dir }}/DEPS"
        python3 "$GITHUB_WORKSPACE/Scripts/scripts/verify_artifacts.py" v8 \
          --root "$GITHUB_WORKSPACE/staging/v8" \
          --platform "${{ inputs.platform }}" \
          --arch "${{ inputs.arch }}"

    - name: Write mksnapshot stack wrapper (windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # mksnapshot overflows its 2MB stack (V8 BUILD.gn /STACK:2097152) and
        # gn/ninja-level linker flags proved unreachable for this target.
        # Instead: a wrapper that rewrites the PE SizeOfStackReserve of the
        # freshly-linked mksnapshot.exe to 256MB, then execs the original
        # tools/run.py with all arguments. Fail-closed on missing run.py.
        $runPy = Join-Path $env:GITHUB_WORKSPACE "v8\v8\tools\run.py"
        if (-not (Test-Path $runPy)) { throw "missing $runPy" }
        $wrapper = @'
        import os, struct, subprocess, sys

        # Resolve "./mksnapshot" -> mksnapshot.exe and enlarge its main-thread
        # stack (PE32+ opt+0x48 / PE32 opt+0x28) before execution.
        exe = sys.argv[1]
        for candidate in (exe, exe + ".exe"):
            if os.path.exists(candidate):
                exe = candidate
                break
        else:
            raise SystemExit("mksnapshot image not found: " + sys.argv[1])
        with open(exe, "r+b") as f:
            f.seek(0x3C)
            pe = struct.unpack("<I", f.read(4))[0]
            f.seek(pe + 24)
            magic = struct.unpack("<H", f.read(2))[0]
            if magic == 0x20B:
                off, width, fmt = pe + 24 + 0x48, 8, "<Q"
            elif magic == 0x10B:
                off, width, fmt = pe + 24 + 0x28, 4, "<I"
            else:
                raise SystemExit("unknown optional-header magic 0x%X" % magic)
            f.seek(off)
            if struct.unpack(fmt, f.read(width))[0] < 0x10000000:
                f.seek(off)
                f.write(struct.pack(fmt, 0x10000000))
        # Run mksnapshot directly (tools/run.py's spawn layer reproduces an
        # early-process crash here that a plain invocation does not) and retry
        # transient NTSTATUS failures.
        cmd = [os.path.abspath(exe)] + sys.argv[2:]
        rc = None
        for attempt in range(3):
            rc = subprocess.run(cmd).returncode
            print("[run_mksnapshot_win] attempt %d rc=%s" % (attempt, rc), flush=True)
            if rc == 0:
                break
        sys.exit(rc)
        '@
        $target = Join-Path $env:GITHUB_WORKSPACE "v8\v8\tools\run_mksnapshot_win.py"
        [IO.File]::WriteAllText($target, $wrapper.Replace("`r`n", "`n"))
        Write-Host "wrote $target"

    - name: Build v8 (windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        set PATH=%GITHUB_WORKSPACE%\depot_tools;%PATH%
        set DEPOT_TOOLS_WIN_TOOLCHAIN=0
        cd %GITHUB_WORKSPACE%\v8\v8

        rem Bump the win-x64 linker stack before generating: V8's BUILD.gn sets
        rem /STACK:2097152 (2MB) for x64 targets and mksnapshot overflows it
        rem during Turbofan scheduling (0xC00000FD). Reserve 256MB instead.
        rem Fail-closed: abort when the upstream pattern is missing.
        powershell -NoProfile -Command "$p='%GITHUB_WORKSPACE%\v8\v8\BUILD.gn'; $t=[IO.File]::ReadAllText($p); if($t.IndexOf('/STACK:2097152') -lt 0){ Write-Error 'expected /STACK:2097152 not found in v8 BUILD.gn'; exit 1 }; [IO.File]::WriteAllText($p, $t.Replace('/STACK:2097152','/STACK:268435456'))"
        if errorlevel 1 exit /b 1
        findstr /C:"/STACK:268435456" "%GITHUB_WORKSPACE%\v8\v8\BUILD.gn" >nul || exit /b 1

        rem windows: v8gen.py is unreliable, use gn gen directly with inline args.
        rem Concurrent builtin generation runs on worker threads whose explicit
        rem small stacks overflow regardless of the main-thread reserve, so pin
        rem snapshot generation to the (enlarged) main thread on windows.
        call gn gen .\out.gn\${{ inputs.target }} -args="is_component_build=false is_debug=false target_cpu=""${{ inputs.arch }}"" target_os=""win"" v8_enable_i18n_support=false v8_monolithic=true v8_use_external_startup_data=false v8_enable_pointer_compression=true v8_jitless=false use_custom_libcxx=false treat_warnings_as_errors=false v8_symbol_level=0 v8_enable_sandbox=false v8_enable_concurrent_mksnapshot=false"

        rem Skip ONLY the ReadOnlyPromotion call on windows: cdb proved an
        rem infinite Promote->IterateBody->VisitObject recursion cycle over a
        rem self-referential Code graph (5-frame repeating stack to overflow),
        rem independent of stack size. The RO-space seal that follows must
        rem still run or serialization asserts.
        powershell -NoProfile -Command "$p='%GITHUB_WORKSPACE%\v8\v8\src\snapshot\snapshot.cc'; $t=[IO.File]::ReadAllText($p); $old='ReadOnlyPromotion::Promote(isolate_, safepoint_scope, no_gc_from_here_on);'; if($t.IndexOf($old) -lt 0){ Write-Error 'RO-promotion call not found in snapshot.cc'; exit 1 }; [IO.File]::WriteAllText($p, $t.Replace($old,'// win-x64: ReadOnlyPromotion recurses infinitely on self-ref Code graphs; objects serialize from mutable heap.'))"
        if errorlevel 1 exit /b 1
        findstr /C:"recurses infinitely" "%GITHUB_WORKSPACE%\v8\v8\src\snapshot\snapshot.cc" >nul || exit /b 1
        rem Route the mksnapshot action through the PE-stack wrapper: swap the
        rem exact launcher substring observed in CI logs inside every generated
        rem ninja file. Fail-closed when nothing matched.
        powershell -NoProfile -Command "$dir='.\\out.gn\\${{ inputs.target }}'; $total=0; Get-ChildItem $dir -Recurse -Filter '*.ninja' | ForEach-Object { $t=[IO.File]::ReadAllText($_.FullName); if($t.Contains('../../tools/run.py ./mksnapshot ')){ $total++; [IO.File]::WriteAllText($_.FullName,$t.Replace('../../tools/run.py ./mksnapshot ','../../tools/run_mksnapshot_win.py ./mksnapshot ')) } }; Write-Host ('ninja files rerouted through stack wrapper: '+$total); if($total -lt 1){ if('${{ inputs.arch }}' -eq 'x64'){ Write-Error 'no ninja file references the mksnapshot run.py launch line'; exit 1 } else { Write-Host ('arch ${{ inputs.arch }} has no overflow; reroute skipped') } }"
        if errorlevel 1 exit /b 1
        dir .\out.gn\${{ inputs.target }}
        more .\out.gn\${{ inputs.target }}\args.gn
        call ninja -C .\out.gn\${{ inputs.target }} v8_monolith
        rem Post-mortem probes (cmd keeps going after ninja fails): run
        rem mksnapshot DIRECTLY from the out dir so its raw stderr surfaces
        rem instead of being swallowed by tools/run.py.
        cd .\out.gn\${{ inputs.target }}
        rem NOTE: `|| echo` would read ERRORLEVEL *after* `type` resets it, so
        rem capture the exit code into a var BEFORE any other command runs.
        .\mksnapshot.exe --help > mksnap_help.txt 2>&1
        set HELP_RC=%ERRORLEVEL%
        echo help-exit-%HELP_RC%
        .\mksnapshot.exe --turbo_instruction_scheduling --stress-turbo-late-spilling --target_os=win --target_arch=x64 --embedded_src gen/embedded.S --predictable --no-use-ic --embedded_variant Default --random-seed 314159265 --startup_src gen/snapshot.cc --no-native-code-counters --concurrent-builtin-generation --concurrent-turbofan-max-threads=0 > mksnap_direct.txt 2>&1
        set DIRECT_RC=%ERRORLEVEL%
        echo direct-exit-%DIRECT_RC%
        rem Head of the captured output: the real error text lives at the TOP.
        powershell -NoProfile -Command "Get-Content mksnap_direct.txt -TotalCount 25"
        rem Minimal-args control run to isolate any single offending flag.
        .\mksnapshot.exe --embedded_src gen/embedded_min.S --startup_src gen/snapshot_min.cc > mksnap_min.txt 2>&1
        set MIN_RC=%ERRORLEVEL%
        echo min-exit-%MIN_RC%
        powershell -NoProfile -Command "Get-Content mksnap_min.txt -TotalCount 25"
        rem Definitive crash-site capture: cdb ships with the Windows SDK on
        rem hosted runners; dump the first-chance AV stack with module+offset.
        set "CDB=C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
        if not exist "%CDB%" for /f "delims=" %%i in ('where cdb.exe 2^>nul') do set "CDB=%%i"
        if exist "%CDB%" (
          "%CDB%" -lines -g -G -c "g;.ecxr;kv 200;q" .\mksnapshot.exe --embedded_src gen/embedded_min.S --startup_src gen/snapshot_min.cc > cdb_out.txt 2>&1
          echo cdb-exit-%ERRORLEVEL%
          powershell -NoProfile -Command "Get-Content cdb_out.txt -TotalCount 120"
        ) else (
          echo cdb-not-found
        )
        rem Two-phase build: if the direct run produced the snapshot sources,
        rem resume ninja so the remaining edges (inline-asm conversion and the
        rem final monolith link) complete and the step succeeds.
        if exist gen\embedded.S (
          echo [two-phase] gen\embedded.S present; resuming ninja
          call ninja -C .\out.gn\${{ inputs.target }} v8_monolith
          if errorlevel 1 exit /b 1
        ) else (
          echo [two-phase] no gen\embedded.S; cannot resume
          exit /b 1
        )
        cd ..\..
        rem Diagnostic: print the PE SizeOfStackReserve actually linked into
        rem mksnapshot so stack-related failures are debuggable from the log.
        python -c "import struct;f=open(r'out.gn\${{ inputs.target }}\mksnapshot.exe','rb');f.seek(0x3c);pe=struct.unpack('<I',f.read(4))[0];f.seek(pe+24);m=struct.unpack('<H',f.read(2))[0];off=pe+24+(0x48 if m==0x20B else 0x28);w='<Q' if m==0x20B else '<I';f.seek(off);print('mksnapshot.exe SizeOfStackReserve =',struct.unpack(w,f.read(8 if m==0x20B else 4))[0])" || echo "PE diagnostic skipped"
        dir %GITHUB_WORKSPACE%\v8\v8\out.gn\${{ inputs.target }}\obj\*.lib

        cd %GITHUB_WORKSPACE%
        mkdir staging\v8\include
        mkdir staging\v8\${{ inputs.staging_dir }}
        xcopy %GITHUB_WORKSPACE%\v8\v8\include staging\v8\include\ /Q /R /S /F /Y
        copy %GITHUB_WORKSPACE%\v8\v8\out.gn\${{ inputs.target }}\obj\v8_monolith.lib staging\v8\${{ inputs.staging_dir }}\v8_monolith.lib /Y /B
        copy %GITHUB_WORKSPACE%\v8\v8\DEPS staging\v8\${{ inputs.staging_dir }}\DEPS /Y /B
        python %GITHUB_WORKSPACE%\Scripts\scripts\verify_artifacts.py v8 --root %GITHUB_WORKSPACE%\staging\v8 --platform ${{ inputs.platform }} --arch ${{ inputs.arch }}
