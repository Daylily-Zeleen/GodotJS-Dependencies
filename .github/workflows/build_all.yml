name: GodotJS Dependencies (All)

on:
  workflow_dispatch:
    inputs:
      bundle_tag:
        description: 'package version tag'
        type: string
        required: true
      v8_version:
        description: 'v8 version tag'
        type: choice
        options:
          - "13.5.119"
          - "12.9.202.28"
          - "12.4.254.21"
        required: true
        default: "13.5.119"
      node_version:
        description: 'node.js branch/tag to build'
        type: choice
        options:
          - "v24.x"
          - "v23.x"
          - "v22.x"
        required: true
        default: "v24.x"
      platforms:
        description: 'comma-separated platforms to build, empty = all (linux,macos,windows,android,ios[,ohos])'
        type: string
        required: false
        default: ''
      keep_ci_releases:
        description: 'How many ci-* per-platform releases to keep (older ones are deleted)'
        type: number
        required: false
        default: 3
      keep_full_releases:
        description: 'How many full bundle releases to keep (older ones are deleted)'
        type: number
        required: false
        default: 5

# Supersede older full builds of the same ref and bundle tag instead of
# stacking them; different bundle tags can still run concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.bundle_tag || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      lws_platforms: ${{ steps.split.outputs.lws_platforms }}
      v8_platforms: ${{ steps.split.outputs.v8_platforms }}
      node_platforms: ${{ steps.split.outputs.node_platforms }}
      run_lws: ${{ steps.split.outputs.run_lws }}
      run_v8: ${{ steps.split.outputs.run_v8 }}
      run_node: ${{ steps.split.outputs.run_node }}
    steps:
      - name: Split component platform selections
        id: split
        shell: bash
        env:
          PLATFORMS_INPUT: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          raw = os.environ.get('PLATFORMS_INPUT', '').strip()
          if not raw or raw == 'all':
              lws = v8 = node = raw or 'all'
          else:
              tokens = [item.strip() for item in raw.split(',') if item.strip()]
              non_ohos = [item for item in tokens if item.split('-', 1)[0] != 'ohos']
              lws = v8 = ','.join(non_ohos) or 'none'
              node = ','.join(tokens)

          run_lws = lws != 'none'
          run_v8 = v8 != 'none'
          run_node = node != 'none'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'lws_platforms={lws}\n')
              output.write(f'v8_platforms={v8}\n')
              output.write(f'node_platforms={node}\n')
              output.write(f'run_lws={str(run_lws).lower()}\n')
              output.write(f'run_v8={str(run_v8).lower()}\n')
              output.write(f'run_node={str(run_node).lower()}\n')
          PY

  v8:
    needs: prepare
    if: ${{ needs.prepare.outputs.run_v8 == 'true' }}
    uses: ./.github/workflows/build_v8.yml
    with:
      v8_version: ${{ inputs.v8_version }}
      platforms: ${{ needs.prepare.outputs.v8_platforms }}
    secrets: inherit

  lws:
    needs: prepare
    if: ${{ needs.prepare.outputs.run_lws == 'true' }}
    uses: ./.github/workflows/build_lws.yml
    with:
      platforms: ${{ needs.prepare.outputs.lws_platforms }}
    secrets: inherit

  node:
    needs: prepare
    if: ${{ needs.prepare.outputs.run_node == 'true' }}
    uses: ./.github/workflows/build_node.yml
    with:
      node_version: ${{ inputs.node_version }}
      platforms: ${{ needs.prepare.outputs.node_platforms }}
    secrets: inherit

  publish:
    needs:
      - prepare
      - v8
      - lws
      - node
    if: ${{ always() && needs.prepare.result == 'success' && ((needs.v8.result == 'success') || (needs.prepare.outputs.run_v8 != 'true')) && ((needs.lws.result == 'success') || (needs.prepare.outputs.run_lws != 'true')) && ((needs.node.result == 'success') || (needs.prepare.outputs.run_node != 'true')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      LWS_PLATFORMS: ${{ needs.prepare.outputs.lws_platforms }}
      V8_PLATFORMS: ${{ needs.prepare.outputs.v8_platforms }}
      NODE_PLATFORMS: ${{ needs.prepare.outputs.node_platforms }}
      RUN_LWS: ${{ needs.prepare.outputs.run_lws }}
      RUN_V8: ${{ needs.prepare.outputs.run_v8 }}
      RUN_NODE: ${{ needs.prepare.outputs.run_node }}
      SKIP_APPLE: ${{ vars.SKIP_APPLE }}
      SKIP_WINDOWS: ${{ vars.SKIP_WINDOWS }}
      OHOS_NATIVE_HOME: ${{ vars.OHOS_NATIVE_HOME }}
      OHOS_SDK_URL: ${{ vars.OHOS_SDK_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: Scripts

      - uses: actions/download-artifact@v8
        with:
          path: staging/
          merge-multiple: true

      - name: Package and validate artifacts
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends zip unzip
          echo "Downloaded artifacts layout:"
          ls -R staging || true

          expected_platforms() {
            local component="$1"
            local component_platforms
            case "$component" in
              lws) component_platforms="${LWS_PLATFORMS:-none}" ;;
              v8) component_platforms="${V8_PLATFORMS:-none}" ;;
              node) component_platforms="${NODE_PLATFORMS:-none}" ;;
              *) echo "Unknown component: $component" >&2; return 1 ;;
            esac
            local args=("$component" --platforms "$component_platforms")
            if [ "${SKIP_APPLE:-}" = "true" ]; then args+=(--skip-apple); fi
            if [ "${SKIP_WINDOWS:-}" = "true" ]; then args+=(--skip-windows); fi
            if [ -n "${OHOS_NATIVE_HOME:-}" ] || [ -n "${OHOS_SDK_URL:-}" ]; then args+=(--ohos-available); fi
            python3 Scripts/scripts/expected_platforms.py "${args[@]}"
          }

          expected_v8=''
          expected_lws=''
          expected_node=''
          if [ "$RUN_V8" = 'true' ]; then expected_v8="$(expected_platforms v8)"; fi
          if [ "$RUN_LWS" = 'true' ]; then expected_lws="$(expected_platforms lws)"; fi
          if [ "$RUN_NODE" = 'true' ]; then expected_node="$(expected_platforms node)"; fi

          if [ "$RUN_V8" = 'true' ]; then
            [ -d staging/v8 ] || { echo "Missing staging/v8 for expected targets: $expected_v8" >&2; exit 1; }
            python3 Scripts/scripts/verify_artifacts.py v8 --root staging/v8 --full --platforms "$expected_v8"
            (cd staging && zip -r "v8_${{ inputs.v8_version }}.zip" v8/)
          fi

          if [ "$RUN_LWS" = 'true' ]; then
            [ -d staging/lws ] || { echo "Missing staging/lws for expected targets: $expected_lws" >&2; exit 1; }
            python3 Scripts/scripts/verify_artifacts.py lws --root staging/lws --full --platforms "$expected_lws"
            (cd staging && zip -r "lws_4.3.zip" lws/)
          fi

          if [ "$RUN_NODE" = 'true' ]; then
            [ -d staging/libnode ] || { echo "Missing staging/libnode for expected targets: $expected_node" >&2; exit 1; }
            python3 Scripts/scripts/write_node_metadata.py \
              --root staging/libnode \
              --node-ref "${{ inputs.node_version }}" \
              --workflow-repository "${{ github.repository }}" \
              --workflow-commit "${{ github.sha }}"
            python3 Scripts/scripts/verify_artifacts.py node --root staging/libnode --full --platforms "$expected_node"
            find staging/libnode -type f -name node-commit.txt -delete
            python3 Scripts/scripts/verify_artifacts.py node --root staging/libnode --full --platforms "$expected_node" --release
            (cd staging && zip -r "node_${{ inputs.node_version }}.zip" libnode/)
          fi

          shopt -s nullglob
          archives=(staging/*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No release archives were created" >&2
            exit 1
          fi
          (cd staging && sha256sum "${archives[@]#staging/}") > staging/SHA256SUMS.txt
          for archive in "${archives[@]}"; do
            unzip -t "$archive" >/dev/null
          done
          cat staging/SHA256SUMS.txt

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The versioned release exists to be consumed by name: GodotJS-Ext's
          # SConstruct points its deps_release_tag at it and downloads
          # {component}_{version}.zip. A build restricted to some platforms would
          # publish bundles missing the others, which looks like a normal release
          # but breaks every consumer on the absent platforms. Publish the
          # versioned release only for a full build; a scoped run gets the
          # per-platform ci-* release below, which is what it is for.
          platforms_input="${{ inputs.platforms }}"
          full_build=true
          if [ -n "$platforms_input" ] && [ "$platforms_input" != "all" ]; then
            full_build=false
          fi

          if [ "$full_build" = true ]; then
            echo "full build: publishing the versioned release ${{ inputs.bundle_tag }}"
            gh release create "${{ inputs.bundle_tag }}" \
              staging/*.zip \
              staging/SHA256SUMS.txt \
              --title "${{ inputs.bundle_tag }}" \
              --notes "V8, libwebsockets and node bundles." \
              --repo ${{ github.repository }} \
              --target ${{ github.sha }}
          else
            echo "::warning::platforms='$platforms_input' selects a subset, so the versioned release ${{ inputs.bundle_tag }} is NOT published (it would be missing platforms and silently break consumers). Publishing only the per-platform ci-* release."
          fi

          # --- Per-platform bundles for GodotJS-Ext's fast path ---------------
          # A separate release tagged ci-<run id> carries one zip per
          # platform+arch. GodotJS-Ext can then pull exactly the target it is
          # testing in minutes instead of waiting for the multi-hour full bundle
          # above, and without a cross-repo token (release assets are
          # anonymously readable, unlike workflow artifacts).
          #
          # The tag embeds the run id on purpose: a fixed tag would let two
          # concurrent runs clobber each other's assets. The cleanup below keeps
          # the list short.
          #
          # Each asset must be usable on its own, so it carries the component's
          # shared include/ tree as well as the platform directory:
          #   staging/v8/include              + staging/v8/<platform>.<arch>.release
          #   staging/libnode/include         + staging/libnode/<os>/<arch>
          #   staging/lws/<platform>_<arch>_release  (its include lives inside)
          # Zipping from the component root preserves those relative paths, so
          # extracting into third/<component>/ yields the layout SCons expects.
          ci_tag="ci-${GITHUB_RUN_ID}"
          rm -rf ci-assets && mkdir -p ci-assets
          : > ci-assets/ci-assets.txt

          bundle() { # bundle <component-root> <asset-name> <paths...>
            local root="$1" asset="$2"; shift 2
            (cd "$root" && zip -qr "$OLDPWD/ci-assets/$asset" "$@")
            # Record the logical target so the consumer never has to reverse
            # engineer a filename: <component> <platform> <arch> <dir> <asset>
            printf '%s\n' "$component $platform $arch $name $asset" >> ci-assets/ci-assets.txt
          }

          # Staging directory names differ per component (<platform>.<arch>.release,
          # <platform>_<arch>_release, <platform>/<arch>); normalise them so every
          # component advertises the same logical platform/arch pair.
          emit() { # emit <component> <platform> <arch> <dirname>
            local comp="$1" plat="$2" ar="$3" dir="$4"
            component="$comp" platform="$plat" arch="$ar" name="$dir"
            case "$comp" in
              v8)  bundle staging/v8  "${comp}_${plat}_${ar}.zip"  "$dir" ;;
              lws) bundle staging/lws "${comp}_${plat}_${ar}.zip"  "$dir" ;;
              node) bundle staging/libnode "${comp}_${plat}_${ar}.zip" "include" "$dir" ;;
            esac
          }

          if [ -d staging/v8 ]; then
            for dir in staging/v8/*/; do
              name="$(basename "$dir")"
              [ "$name" = include ] && continue
              norm="$(printf '%s' "$name" | sed -E 's/[._]release$//' | tr '.' '_')"
              emit v8 "${norm%%_*}" "${norm#*_}" "$name"
            done
            # The include tree is staged by EVERY v8 leg and is identical, so
            # bundling it into each asset would duplicate it 22 times.
            if [ -d staging/v8/include ]; then
              component=v8 platform=any arch=any name=include
              bundle staging/v8 v8_include.zip include
            fi
          fi

          if [ -d staging/lws ]; then
            for dir in staging/lws/*/; do
              name="$(basename "$dir")"
              [ "$name" = include ] && continue
              norm="$(printf '%s' "$name" | sed -E 's/[._]release$//' | tr '.' '_')"
              emit lws "${norm%%_*}" "${norm#*_}" "$name"
            done
          fi

          if [ -d staging/libnode ]; then
            for platdir in staging/libnode/*/; do
              plat="$(basename "$platdir")"
              [ "$plat" = include ] && continue
              for archdir in "$platdir"*/; do
                [ -d "$archdir" ] || continue
                emit node "$plat" "$(basename "$archdir")" "$plat/$(basename "$archdir")"
              done
            done
          fi

          count=$(find ci-assets -name '*.zip' | wc -l)
          echo "per-platform bundles: $count"
          cat ci-assets/ci-assets.txt
          [ "$count" -gt 0 ] || { echo "no per-platform bundles were produced" >&2; exit 1; }

          gh release create "$ci_tag" ci-assets/*.zip ci-assets/ci-assets.txt \
            --title "$ci_tag" \
            --notes "Per-platform prebuilt bundles from run ${GITHUB_RUN_ID} (commit ${GITHUB_SHA}). Consumed by GodotJS-Ext's CI fast path (see ci-assets.txt for the target -> asset mapping); older ci-* releases are pruned automatically." \
            --repo ${{ github.repository }} \
            --target ${{ github.sha }}

          # --- Retention ------------------------------------------------------
          # Without this every run would leave releases behind (the full bundle
          # per bundle_tag, plus one ci-* per run) and the list grows forever.
          # Newest-first, keeping the current run's tags unconditionally.
          list_tags() { # list_tags <jq-filter>
            gh release list --repo "${{ github.repository }}" --limit 100 \
              --json tagName,createdAt -q "$1" \
              | sort -r | awk 'NF{print $2}'
          }

          ci_tags=$(list_tags '.[] | select(.tagName | startswith("ci-")) | .createdAt + " " + .tagName')
          echo "ci releases (newest first): $(echo "$ci_tags" | tr '\n' ' ')"
          echo "$ci_tags" | tail -n +$(( ${{ inputs.keep_ci_releases }} + 1 )) | while read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" = "$ci_tag" ] && continue
            echo "deleting superseded $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done

          full_tags=$(list_tags '.[] | select((.tagName | startswith("ci-")) | not) | .createdAt + " " + .tagName')
          echo "full releases (newest first): $(echo "$full_tags" | tr '\n' ' ')"
          echo "$full_tags" | tail -n +$(( ${{ inputs.keep_full_releases }} + 1 )) | while read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" = "${{ inputs.bundle_tag }}" ] && continue
            echo "deleting superseded $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done
