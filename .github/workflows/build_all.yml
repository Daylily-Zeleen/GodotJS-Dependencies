name: GodotJS Dependencies (All)

on:
  workflow_dispatch:
    inputs:
      bundle_tag:
        description: 'package version tag'
        type: string
        required: true
      v8_version:
        description: 'v8 version tag'
        type: choice
        options:
          - "13.5.119"
          - "12.9.202.28" # 2022
          - "12.4.254.21" # 2019
        required: true
        default: "13.5.119"
      node_version:
        description: 'node.js branch/tag to build'
        type: choice
        options:
          - "v24.x"
          - "v23.x"
          - "v22.x"
        required: true
        default: "v24.x"
      platforms:
        description: 'comma-separated platforms to build, empty = all (linux,macos,windows,android,ios[,ohos])'
        type: string
        required: false
        default: ''

jobs:
  v8:
    uses: ./.github/workflows/build_v8.yml
    with:
      v8_version: ${{ inputs.v8_version }}
      platforms: ${{ inputs.platforms }}
    secrets: inherit

  lws:
    uses: ./.github/workflows/build_lws.yml
    with:
      platforms: ${{ inputs.platforms }}
    secrets: inherit

  node:
    uses: ./.github/workflows/build_node.yml
    with:
      node_version: ${{ inputs.node_version }}
      platforms: ${{ inputs.platforms }}
    secrets: inherit

  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs:
      - v8
      - lws
      - node
    if: ${{ always() && (needs.v8.result == 'success') && (needs.lws.result == 'success') && (needs.node.result == 'success') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging/
          merge-multiple: true

      - name: packaging
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends zip unzip
          echo "Downloaded artifacts layout:"
          ls -R staging || true

          if [ -d staging/v8 ]; then
            (cd staging && zip -r "v8_${{ github.event.inputs.v8_version }}.zip" v8/)
            echo "Created V8 bundle: staging/v8_${{ github.event.inputs.v8_version }}.zip"
          else
            echo "No v8 artifacts, skipping v8 bundle"
          fi

          if [ -d staging/lws ]; then
            (cd staging && zip -r "lws_4.3.zip" lws/)
            echo "Created LWS bundle: staging/lws_4.3.zip"
          else
            echo "No lws artifacts, skipping lws bundle"
          fi

          if [ -d staging/libnode ]; then
            (cd staging && zip -r "node_${{ github.event.inputs.node_version }}.zip" libnode/)
            echo "Created node bundle: staging/node_${{ github.event.inputs.node_version }}.zip"
          else
            echo "No node artifacts, skipping node bundle"
          fi

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.bundle_tag }}" \
            staging/*.zip \
            --title "${{ github.event.inputs.bundle_tag }}" \
            --notes "V8, libwebsockets and node bundles." \
            --repo ${{ github.repository }} \
            --target ${{ github.sha }}
