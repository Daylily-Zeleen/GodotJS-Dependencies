name: Build Node

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'node.js branch/tag to build'
        type: choice
        options:
          - "v24.x"
          - "v23.x"
          - "v22.x"
        required: true
        default: "v24.x"
      platforms:
        description: 'comma-separated platforms or platform-arch combos to build, empty = all (linux,linux-x86_64,macos,windows,android,ios,ohos)'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: ''

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    env:
      PLATFORMS: ${{ inputs.platforms }}
      SKIP_APPLE: ${{ vars.SKIP_APPLE }}
      SKIP_WINDOWS: ${{ vars.SKIP_WINDOWS }}
      OHOS_NATIVE_HOME: ${{ vars.OHOS_NATIVE_HOME }}
      OHOS_SDK_URL: ${{ vars.OHOS_SDK_URL }}
    steps:
      - name: Generate build matrix
        id: gen
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os

          platforms = os.environ.get('PLATFORMS', '').strip()
          skip_apple = os.environ.get('SKIP_APPLE', '').strip() == 'true'
          skip_windows = os.environ.get('SKIP_WINDOWS', '').strip() == 'true'
          ohos_native = os.environ.get('OHOS_NATIVE_HOME', '').strip()
          ohos_sdk_url = os.environ.get('OHOS_SDK_URL', '').strip()

          combos = [
            # linux
            {"platform": "linux", "arch": "x86_64", "runner": "ubuntu-22.04", "staging": "linux_x86_64_release", "artifact": "prebuilt_node_linux_x86_64"},
            # macos
            {"platform": "macos", "arch": "arm64", "runner": "macos-latest", "staging": "macos_arm64_release", "artifact": "prebuilt_node_macos_arm64"},
            # windows
            {"platform": "windows", "arch": "x86_64", "runner": "windows-2022", "staging": "windows_x86_64_release", "artifact": "prebuilt_node_windows_x86_64"},
            # android
            {"platform": "android", "arch": "arm64", "runner": "ubuntu-22.04", "staging": "android_arm64_release", "artifact": "prebuilt_node_android_arm64"},
            # ios
            {"platform": "ios", "arch": "arm64", "runner": "macos-latest", "staging": "ios_arm64_release", "artifact": "prebuilt_node_ios_arm64"},
            # ohos (OHOS native toolchain is linux-based: aarch64-unknown-linux-ohos-clang)
            {"platform": "ohos", "arch": "arm64", "runner": "ubuntu-22.04", "staging": "ohos_arm64_release", "artifact": "prebuilt_node_ohos_arm64"},
          ]

          # Parse platforms: entries can be "platform" (all arches) or "platform-arch" (e.g. linux-x86_64)
          want = None
          want_arch = {}
          if platforms and platforms != 'all':
              want = set()
              for p in platforms.split(','):
                  p = p.strip()
                  if not p:
                      continue
                  if '-' in p:
                      plat, _, arch = p.partition('-')
                      want.add(plat)
                      want_arch.setdefault(plat, set()).add(arch)
                  else:
                      want.add(p)

          selected = []
          for c in combos:
              if want is not None and c['platform'] not in want:
                  continue
              if want_arch and c['platform'] in want_arch and c['arch'] not in want_arch[c['platform']]:
                  continue
              if skip_apple and c['platform'] in ('macos', 'ios'):
                  continue
              if skip_windows and c['platform'] == 'windows':
                  continue
              if c['platform'] == 'ohos' and not (ohos_native or ohos_sdk_url):
                  continue
              selected.append(c)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"matrix={json.dumps(selected)}\n")
          PY

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    env:
      NODE_VERSION: ${{ inputs.node_version || github.event.inputs.node_version }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Detect act environment
        shell: pwsh
        run: |
          if ($env:ACT) { echo "IS_ACT=true" >> $env:GITHUB_ENV } else { echo "IS_ACT=false" >> $env:GITHUB_ENV }

      - uses: actions/checkout@v4
        with:
          path: Scripts

      - uses: actions/setup-python@v5
        if: ${{ matrix.platform == 'windows' && vars.HOST_WINDOWS != 'true' || matrix.platform == 'macos' || matrix.platform == 'ios' }}
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Cache Android NDK r23c
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: android-ndk-r23c
          key: android-ndk-r23c-${{ runner.os }}-v23c

      - name: Fetch node (${{ matrix.platform }} ${{ matrix.arch }})
        uses: ./Scripts/.github/actions/node/fetch
        with:
          node_version: ${{ env.NODE_VERSION }}
          platform: ${{ matrix.platform }}

      - name: Build node (${{ matrix.platform }} ${{ matrix.arch }})
        uses: ./Scripts/.github/actions/node/build
        with:
          node_version: ${{ env.NODE_VERSION }}
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      - name: Upload
        uses: ./Scripts/.github/actions/upload
        with:
          artifact_name: ${{ matrix.artifact }}
